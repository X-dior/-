<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>业务管理后台</title>
    <style>
        :root {
            --primary: #5381f3;
            --primary-hover: #3d6ad6;
            --primary-light: #eef2fd;
            --text-primary: #1a1a2e;
            --text-secondary: #5a5f7a;
            --text-muted: #8b8fa3;
            --border-color: #e5e7ef;
            --bg-page: #f4f6fb;
            --bg-white: #ffffff;
            --danger: #f44e4e;
            --success: #2ecc71;
            --shadow-sm: 0 1px 3px rgba(0, 0, 0, 0.04);
            --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.06);
            --radius: 6px;
            --radius-sm: 4px;
            --transition: all 0.2s ease;
            --sidebar-width: 220px;
            --topbar-height: 56px;
            --btn-height: 32px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-page);
            color: var(--text-primary);
            line-height: 1.5;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            min-width: 1366px;
        }

        /* ========== 顶部导航栏 ========== */
        .topbar {
            height: var(--topbar-height);
            background: var(--bg-white);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            padding: 0 24px;
            z-index: 100;
            box-shadow: var(--shadow-sm);
            flex-shrink: 0;
        }

        .topbar-logo {
            font-weight: 700;
            font-size: 17px;
            color: var(--primary);
            margin-right: 48px;
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .topbar-logo svg {
            width: 24px;
            height: 24px;
            fill: none;
            stroke: var(--primary);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .topbar-nav {
            display: flex;
            gap: 8px;
            height: 100%;
            flex: 1;
        }

        .topbar-nav-item {
            padding: 0 28px;
            height: 100%;
            display: flex;
            align-items: center;
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            transition: var(--transition);
            position: relative;
            white-space: nowrap;
            gap: 6px;
        }
        .topbar-nav-item:hover {
            color: var(--primary);
            background: var(--primary-light);
        }
        .topbar-nav-item.active {
            color: var(--primary);
            border-bottom-color: var(--primary);
            font-weight: 600;
        }
        .topbar-nav-item.dropdown-trigger {
            padding-right: 32px;
        }
        .topbar-nav-item.dropdown-trigger::after {
            content: '';
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            border-left: 4px solid transparent;
            border-right: 4px solid transparent;
            border-top: 5px solid currentColor;
            transition: var(--transition);
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-left: auto;
        }

        .topbar-icon {
            width: 32px;
            height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-sm);
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
        }
        .topbar-icon:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .topbar-icon svg {
            width: 18px;
            height: 18px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .old-version-btn {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 13px;
            color: var(--text-muted);
            cursor: pointer;
            padding: 6px 12px;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            border: 1px solid transparent;
        }
        .old-version-btn:hover {
            border-color: var(--border-color);
            background: #fafafa;
            color: var(--text-secondary);
        }
        .old-version-btn svg {
            width: 16px;
            height: 16px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .user-menu {
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: var(--radius);
            transition: var(--transition);
            position: relative;
            font-size: 14px;
            color: var(--text-primary);
            font-weight: 500;
        }
        .user-menu:hover {
            background: var(--primary-light);
        }
        .avatar-placeholder {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: var(--primary);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 600;
            font-size: 14px;
        }

        /* 下拉菜单通用样式 */
        .dropdown-menu {
            position: absolute;
            top: calc(100% + 4px);
            right: 0;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            min-width: 160px;
            padding: 4px 0;
            display: none;
            z-index: 200;
            list-style: none;
        }
        .dropdown-menu.show {
            display: block;
        }
        .dropdown-menu li {
            padding: 8px 16px;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
            transition: background 0.15s;
            white-space: nowrap;
        }
        .dropdown-menu li:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .dropdown-menu li.danger {
            color: var(--danger);
        }
        .dropdown-menu li.danger:hover {
            background: #fff1f1;
        }
        .dropdown-divider {
            height: 1px;
            background: var(--border-color);
            margin: 4px 0;
        }

        /* 平台下拉子模块选择 */
        .module-sub-dropdown {
            position: absolute;
            top: 100%;
            left: 0;
            background: white;
            border-radius: var(--radius);
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            min-width: 140px;
            display: none;
            z-index: 150;
            padding: 4px 0;
            list-style: none;
        }
        .module-sub-dropdown.show {
            display: block;
        }
        .module-sub-dropdown li {
            padding: 8px 20px;
            font-size: 13px;
            cursor: pointer;
            color: var(--text-primary);
            transition: background 0.15s;
        }
        .module-sub-dropdown li:hover {
            background: var(--primary-light);
            color: var(--primary);
        }

        /* ========== 主体布局 ========== */
        .main-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* 左侧菜单 */
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-white);
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
            padding-top: 8px;
            transition: var(--transition);
        }

        .menu-item {
            padding: 0 8px;
            margin: 2px 0;
        }
        .menu-item-header {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            font-size: 14px;
            font-weight: 500;
            color: var(--text-primary);
            transition: var(--transition);
            gap: 10px;
            user-select: none;
        }
        .menu-item-header:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .menu-icon {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
            stroke: currentColor;
            fill: none;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        .menu-item.active > .menu-item-header {
            background: var(--primary-light);
            color: var(--primary);
            font-weight: 600;
        }
        .menu-arrow {
            margin-left: auto;
            transition: transform 0.2s;
            stroke: currentColor;
            width: 14px;
            height: 14px;
        }
        .menu-item.expanded > .menu-item-header .menu-arrow {
            transform: rotate(90deg);
        }

        .submenu {
            list-style: none;
            padding-left: 28px;
            overflow: hidden;
            max-height: 0;
            transition: max-height 0.3s ease;
        }
        .menu-item.expanded .submenu {
            max-height: 300px;
        }
        .submenu li {
            padding: 8px 12px;
            font-size: 13px;
            color: var(--text-secondary);
            cursor: pointer;
            border-radius: var(--radius-sm);
            transition: var(--transition);
            margin: 2px 0;
        }
        .submenu li:hover {
            background: var(--primary-light);
            color: var(--primary);
        }
        .submenu li.active {
            color: var(--primary);
            background: var(--primary-light);
            font-weight: 500;
        }

        /* 右侧内容区 */
        .content-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            padding: 20px;
            gap: 16px;
        }

        /* 筛选栏 */
        .filter-bar {
            background: var(--bg-white);
            padding: 12px 20px;
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
        }
        .filter-left {
            display: flex;
            align-items: center;
            gap: 20px;
            flex-wrap: wrap;
        }
        .filter-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .filter-item input,
        .filter-item select {
            padding: 6px 12px;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-sm);
            font-size: 13px;
            min-width: 160px;
            background: white;
            color: var(--text-primary);
            outline: none;
            transition: var(--transition);
            height: var(--btn-height);
        }
        .filter-item input:focus,
        .filter-item select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 2px rgba(83, 129, 243, 0.15);
        }

        /* 统一按钮尺寸 */
        .btn {
            height: var(--btn-height);
            padding: 0 16px;
            border-radius: var(--radius-sm);
            font-size: 13px;
            border: 1px solid transparent;
            cursor: pointer;
            font-weight: 500;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            white-space: nowrap;
            line-height: 1;
        }
        .btn-primary {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }
        .btn-primary:hover {
            background: var(--primary-hover);
        }
        .btn-outline {
            background: white;
            border-color: var(--border-color);
            color: var(--text-primary);
        }
        .btn-outline:hover {
            border-color: var(--primary);
            color: var(--primary);
        }
        .btn-danger {
            background: white;
            border-color: var(--danger);
            color: var(--danger);
        }
        .btn-danger:hover {
            background: #fff1f1;
        }
        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* 表格容器 */
        .table-wrapper {
            background: var(--bg-white);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            display: flex;
            flex-direction: column;
            flex: 1;
            overflow: auto;
        }

        .table-actions {
            padding: 12px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            flex-wrap: wrap;
            gap: 12px;
        }
        .batch-actions {
            display: flex;
            align-items: center;
            gap: 12px;
            height: var(--btn-height);
        }
        .batch-count {
            font-size: 13px;
            color: var(--text-secondary);
            background: #f5f6fa;
            padding: 4px 12px;
            border-radius: 12px;
            line-height: 1.4;
        }
        .table-actions-right {
            display: flex;
            gap: 8px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
        }
        thead th {
            text-align: left;
            padding: 12px 16px;
            background: #fafbfc;
            color: var(--text-secondary);
            font-weight: 600;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
            position: sticky;
            top: 0;
        }
        tbody td {
            padding: 12px 16px;
            border-bottom: 1px solid #f0f1f5;
            vertical-align: middle;
        }
        tbody tr:hover {
            background: #fafbff;
        }
        .cell-url {
            max-width: 220px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            display: inline-block;
            cursor: default;
        }
        .cell-url:hover {
            text-decoration: underline;
            color: var(--primary);
        }

        /* 状态样式：圆点+文字 */
        .status-dot {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
        }
        .status-dot.enabled {
            color: #1e9e4a;
        }
        .status-dot.disabled {
            color: #d32f2f;
        }
        .status-dot::before {
            content: '';
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        /* 操作链接样式 */
        .action-links {
            display: flex;
            gap: 16px;
        }
        .action-link {
            font-size: 13px;
            text-decoration: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .action-link.edit,
        .action-link.view {
            color: var(--primary);
        }
        .action-link.disable {
            color: var(--danger);
        }
        .action-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        .expand-icon {
            display: inline-flex;
            width: 20px;
            height: 20px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-right: 4px;
            stroke: currentColor;
            color: var(--text-muted);
            transition: transform 0.2s;
        }
        .expand-icon.collapsed {
            transform: rotate(-90deg);
        }
        .child-row td:first-child {
            padding-left: 44px;
        }

        /* 分页 */
        .pagination {
            padding: 12px 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 16px;
            font-size: 13px;
            color: var(--text-secondary);
            flex-wrap: wrap;
        }
        .page-btn {
            width: 28px;
            height: 28px;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            background: white;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            transition: var(--transition);
            color: var(--text-primary);
        }
        .page-btn:hover:not(:disabled) {
            border-color: var(--primary);
            color: var(--primary);
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .page-btn.active {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }
        .page-size-select,
        .page-jump input {
            padding: 4px 8px;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            font-size: 13px;
            text-align: center;
            height: 28px;
        }
        .page-jump {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        input[type="checkbox"] {
            accent-color: var(--primary);
            width: 15px;
            height: 15px;
        }
    </style>
</head>
<body>
    <header class="topbar">
        <div class="topbar-logo">
            <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
            业务管理后台
        </div>
        <nav class="topbar-nav" id="topNav">
            <div class="topbar-nav-item active" data-module="user">用户</div>
            <div class="topbar-nav-item" data-module="operation">运营</div>
            <div class="topbar-nav-item" data-module="channel">渠道</div>
            <div class="topbar-nav-item" data-module="system">系统</div>
            <div class="topbar-nav-item dropdown-trigger" data-module="platform" id="platformTrigger">平台
                <ul class="module-sub-dropdown" id="platformDropdown">
                    <li data-sub="platform-overview">平台概览</li>
                    <li data-sub="platform-config">平台配置</li>
                    <li data-sub="platform-log">操作日志</li>
                </ul>
            </div>
        </nav>
        <div class="topbar-actions">
            <span class="old-version-btn" id="switchOldBtn">
                <svg viewBox="0 0 24 24"><path d="M11 19l-7-7 7-7m8 14l-7-7 7-7"/></svg>
                切换旧版
            </span>
            <span class="topbar-icon" title="搜索"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></span>
            <span class="topbar-icon" title="下载"><svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg></span>
            <span class="topbar-icon" title="收藏"><svg viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg></span>
            <span class="topbar-icon" title="操作指南"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></span>
            <div class="user-menu" id="userMenuTrigger">
                <div class="avatar-placeholder">李</div>
                <span>李明远</span>
                <ul class="dropdown-menu" id="userDropdown">
                    <li>账号</li>
                    <li>部门</li>
                    <li>角色</li>
                    <li>修改密码</li>
                    <li>解绑钉钉</li>
                    <li class="dropdown-divider"></li>
                    <li class="danger">退出</li>
                </ul>
            </div>
        </div>
    </header>

    <div class="main-container">
        <aside class="sidebar" id="sidebar"></aside>
        <section class="content-area">
            <div class="filter-bar">
                <div class="filter-left">
                    <div class="filter-item">
                        <span>菜单</span>
                        <input type="text" placeholder="请输入菜单名称" id="filterMenuName">
                    </div>
                    <div class="filter-item">
                        <span>状态</span>
                        <select id="filterStatus">
                            <option value="">全部</option>
                            <option value="1">启用</option>
                            <option value="0">禁用</option>
                        </select>
                    </div>
                </div>
                <button class="btn btn-primary" id="searchBtn">查询</button>
            </div>

            <div class="table-wrapper">
                <div class="table-actions">
                    <div class="batch-actions">
                        <button class="btn btn-outline" id="batchBtn" disabled>批量操作</button>
                        <span class="batch-count" id="batchCount" style="display:none;">已选 <strong id="selectedNum">0</strong> 条</span>
                        <ul class="dropdown-menu" id="batchDropdown" style="left:0; right:auto; min-width:140px;">
                            <li data-action="enable">批量启用</li>
                            <li data-action="disable">批量禁用</li>
                            <li data-action="delete" class="danger">批量删除</li>
                        </ul>
                    </div>
                    <div class="table-actions-right">
                        <button class="btn btn-outline" id="addBtn">新增</button>
                        <button class="btn btn-outline" id="exportBtn">导出</button>
                    </div>
                </div>

                <div style="overflow-x: auto; flex:1;">
                    <table id="dataTable">
                        <thead>
                            <tr>
                                <th style="width:40px;"><input type="checkbox" id="selectAll"></th>
                                <th>菜单ID</th>
                                <th>菜单名称</th>
                                <th style="min-width:200px;">页面地址</th>
                                <th>管理员</th>
                                <th>权限配置</th>
                                <th>最后编辑时间</th>
                                <th>状态</th>
                                <th>操作</th>
                            </tr>
                        </thead>
                        <tbody id="tableBody"></tbody>
                    </table>
                </div>

                <div class="pagination">
                    <span>共 <strong id="totalCount">0</strong> 条</span>
                    <button class="page-btn" id="prevPage">◀</button>
                    <span id="currentPage">1</span>
                    <button class="page-btn" id="nextPage">▶</button>
                    <select class="page-size-select" id="pageSizeSelect">
                        <option value="10">10条/页</option>
                        <option value="20">20条/页</option>
                        <option value="50">50条/页</option>
                        <option value="100">100条/页</option>
                    </select>
                    <div class="page-jump">
                        <span>前往第</span>
                        <input type="number" id="jumpPage" value="1" min="1">
                        <span>页</span>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <script>
        (function() {
            // 数据
            const menuData = [
                { id: '1001', name: '权限管理', url: 'https://admin.example.com/system/permission/manage', admin: '张伟', permissions: '编辑,查看', time: '2026-05-08 14:32:15', status: 1, parent: null },
                { id: '1002', name: '角色权限', url: 'https://admin.example.com/system/permission/role', admin: '张伟', permissions: '编辑', time: '2026-05-07 09:15:22', status: 1, parent: '1001' },
                { id: '1003', name: '账号权限', url: 'https://admin.example.com/system/permission/account', admin: '李娜', permissions: '查看', time: '2026-05-06 16:40:03', status: 1, parent: '1001' },
                { id: '1004', name: '部门管理', url: 'https://admin.example.com/system/dept', admin: '王强', permissions: '编辑,查看', time: '2026-05-05 11:20:44', status: 1, parent: null },
                { id: '1005', name: '后台配置管理', url: 'https://admin.example.com/config/setting', admin: '赵雪', permissions: '编辑,查看', time: '2026-05-04 08:55:10', status: 1, parent: null },
                { id: '1006', name: '后台配置', url: 'https://admin.example.com/config/setting/detail', admin: '赵雪', permissions: '查看', time: '2026-05-03 13:25:36', status: 0, parent: '1005' },
                { id: '1007', name: '用户列表', url: 'https://admin.example.com/user/list', admin: '周涛', permissions: '编辑,查看', time: '2026-05-02 17:18:09', status: 1, parent: null },
            ];

            let currentModule = 'user';
            let activeSubmenu = '角色权限';

            // 菜单SVG图标定义（线性风格）
            const menuIcons = {
                '权限管理': '<svg class="menu-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
                '后台配置管理': '<svg class="menu-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
                '用户列表': '<svg class="menu-icon" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>',
                '活动管理': '<svg class="menu-icon" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
                '数据报表': '<svg class="menu-icon" viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg>',
                '渠道管理': '<svg class="menu-icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>',
                '系统设置': '<svg class="menu-icon" viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>',
                '平台概览': '<svg class="menu-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
                '平台配置': '<svg class="menu-icon" viewBox="0 0 24 24"><line x1="4" y1="21" x2="4" y2="14"/><line x1="4" y1="10" x2="4" y2="3"/><line x1="12" y1="21" x2="12" y2="12"/><line x1="12" y1="8" x2="12" y2="3"/><line x1="20" y1="21" x2="20" y2="16"/><line x1="20" y1="12" x2="20" y2="3"/><line x1="1" y1="14" x2="7" y2="14"/><line x1="9" y1="8" x2="15" y2="8"/><line x1="17" y1="16" x2="23" y2="16"/></svg>',
                '操作日志': '<svg class="menu-icon" viewBox="0 0 24 24"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><rect x="8" y="2" width="8" height="4" rx="1" ry="1"/></svg>',
                '角色权限': '<svg class="menu-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
                '账号权限': '<svg class="menu-icon" viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>',
                '部门管理': '<svg class="menu-icon" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/></svg>',
                '后台配置': '<svg class="menu-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>',
            };

            const moduleMenus = {
                user: [
                    { name: '权限管理', children: ['角色权限', '账号权限', '部门管理'] },
                    { name: '后台配置管理', children: ['后台配置'] },
                    { name: '用户列表', children: [] }
                ],
                operation: [
                    { name: '活动管理', children: ['活动列表', '活动配置'] },
                    { name: '数据报表', children: [] }
                ],
                channel: [
                    { name: '渠道管理', children: ['渠道列表', '渠道分析'] }
                ],
                system: [
                    { name: '系统设置', children: ['基础配置', '日志管理'] },
                    { name: '权限管理', children: ['角色权限', '账号权限', '部门管理'] }
                ],
                platform: [
                    { name: '平台概览', children: [] },
                    { name: '平台配置', children: ['全局设置', '功能开关'] },
                    { name: '操作日志', children: [] }
                ]
            };

            function renderSidebar(module) {
                const menus = moduleMenus[module] || moduleMenus.user;
                const sidebar = document.getElementById('sidebar');
                let html = '';
                menus.forEach(menu => {
                    const hasChildren = menu.children && menu.children.length > 0;
                    const isExpanded = hasChildren && menu.children.includes(activeSubmenu);
                    const iconSvg = menuIcons[menu.name] || '';
                    html += `<div class="menu-item ${isExpanded ? 'expanded' : ''} ${menu.name === activeSubmenu && !hasChildren ? 'active' : ''}">`;
                    html += `<div class="menu-item-header" data-menu="${menu.name}">`;
                    html += iconSvg + menu.name;
                    if (hasChildren) {
                        html += `<svg class="menu-arrow" viewBox="0 0 24 24"><polyline points="9 18 15 12 9 6"/></svg>`;
                    }
                    html += `</div>`;
                    if (hasChildren) {
                        html += `<ul class="submenu">`;
                        menu.children.forEach(child => {
                            html += `<li class="${child === activeSubmenu ? 'active' : ''}" data-submenu="${child}">${child}</li>`;
                        });
                        html += `</ul>`;
                    }
                    html += `</div>`;
                });
                sidebar.innerHTML = html;

                document.querySelectorAll('.menu-item-header').forEach(header => {
                    header.addEventListener('click', function(e) {
                        const menuName = this.dataset.menu;
                        const parentItem = this.parentElement;
                        if (parentItem.querySelector('.submenu')) {
                            parentItem.classList.toggle('expanded');
                        } else {
                            setActiveMenu(menuName);
                        }
                    });
                });
                document.querySelectorAll('.submenu li').forEach(li => {
                    li.addEventListener('click', function(e) {
                        e.stopPropagation();
                        setActiveMenu(this.dataset.submenu);
                    });
                });
            }

            function setActiveMenu(name) {
                activeSubmenu = name;
                document.querySelectorAll('.submenu li').forEach(li => li.classList.remove('active'));
                document.querySelectorAll('.menu-item').forEach(item => item.classList.remove('active'));
                const activeLi = document.querySelector(`.submenu li[data-submenu="${name}"]`);
                if (activeLi) {
                    activeLi.classList.add('active');
                    activeLi.closest('.menu-item').classList.add('expanded', 'active');
                } else {
                    const header = document.querySelector(`.menu-item-header[data-menu="${name}"]`);
                    if (header) header.parentElement.classList.add('active');
                }
            }

            function switchModule(module) {
                currentModule = module;
                document.querySelectorAll('.topbar-nav-item').forEach(item => item.classList.remove('active'));
                document.querySelector(`.topbar-nav-item[data-module="${module}"]`)?.classList.add('active');
                const menus = moduleMenus[module] || moduleMenus.user;
                if (menus.length > 0) {
                    if (menus[0].children && menus[0].children.length > 0) {
                        activeSubmenu = menus[0].children[0];
                    } else {
                        activeSubmenu = menus[0].name;
                    }
                }
                renderSidebar(module);
            }

            // 表格渲染
            function renderTable(data) {
                const tbody = document.getElementById('tableBody');
                let html = '';
                const parents = data.filter(d => !d.parent);
                parents.forEach(p => {
                    const children = data.filter(d => d.parent === p.id);
                    const hasChildren = children.length > 0;
                    html += renderRow(p, false, hasChildren);
                    if (hasChildren) {
                        children.forEach(c => html += renderRow(c, true));
                    }
                });
                tbody.innerHTML = html;
                bindRowEvents();
                updateBatchButton();
                document.getElementById('totalCount').textContent = data.length;
            }

            function renderRow(row, isChild, hasChildren = false) {
                const statusClass = row.status === 1 ? 'enabled' : 'disabled';
                const statusText = row.status === 1 ? '启用' : '禁用';
                const expandIcon = hasChildren ?
                    `<svg class="expand-icon collapsed" data-id="${row.id}" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>` :
                    `<span style="display:inline-block;width:20px;"></span>`;
                return `
                <tr class="${isChild ? 'child-row' : ''}" data-id="${row.id}" data-parent="${row.parent || ''}">
                    <td>${expandIcon}<input type="checkbox" class="row-checkbox" data-id="${row.id}"></td>
                    <td>${row.id}</td>
                    <td>${row.name}</td>
                    <td><span class="cell-url" title="${row.url}">${row.url}</span></td>
                    <td>${row.admin}</td>
                    <td>${row.permissions}</td>
                    <td>${row.time}</td>
                    <td><span class="status-dot ${statusClass}">${statusText}</span></td>
                    <td>
                        <div class="action-links">
                            <a class="action-link edit" data-id="${row.id}">编辑</a>
                            <a class="action-link view" data-id="${row.id}">查看</a>
                            <a class="action-link disable" data-id="${row.id}">${row.status === 1 ? '禁用' : '启用'}</a>
                        </div>
                    </td>
                </tr>`;
            }

            function bindRowEvents() {
                document.querySelectorAll('.expand-icon').forEach(icon => {
                    icon.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const parentId = this.dataset.id;
                        const childRows = document.querySelectorAll(`tr.child-row[data-parent="${parentId}"]`);
                        const isCollapsed = this.classList.contains('collapsed');
                        childRows.forEach(row => row.style.display = isCollapsed ? '' : 'none');
                        this.classList.toggle('collapsed');
                    });
                });
                document.querySelectorAll('.row-checkbox').forEach(cb => {
                    cb.addEventListener('change', updateBatchButton);
                });
                document.getElementById('selectAll').addEventListener('change', function() {
                    const checked = this.checked;
                    document.querySelectorAll('.row-checkbox').forEach(cb => cb.checked = checked);
                    updateBatchButton();
                });
                document.querySelectorAll('.action-link.edit').forEach(a => a.addEventListener('click', () => alert('编辑功能')));
                document.querySelectorAll('.action-link.view').forEach(a => a.addEventListener('click', () => alert('查看详情')));
                document.querySelectorAll('.action-link.disable').forEach(a => {
                    a.addEventListener('click', function() {
                        const rowId = this.dataset.id;
                        const row = menuData.find(d => d.id === rowId);
                        if (row) {
                            row.status = row.status === 1 ? 0 : 1;
                            renderTable(menuData);
                        }
                    });
                });
            }

            function updateBatchButton() {
                const checkedCount = document.querySelectorAll('.row-checkbox:checked').length;
                const batchBtn = document.getElementById('batchBtn');
                const batchCount = document.getElementById('batchCount');
                batchBtn.disabled = checkedCount === 0;
                if (checkedCount > 0) {
                    batchCount.style.display = 'inline-flex';
                    document.getElementById('selectedNum').textContent = checkedCount;
                } else {
                    batchCount.style.display = 'none';
                }
                const allCb = document.querySelectorAll('.row-checkbox');
                const selectAll = document.getElementById('selectAll');
                if (allCb.length === 0) {
                    selectAll.checked = false;
                    selectAll.indeterminate = false;
                } else {
                    selectAll.checked = checkedCount === allCb.length;
                    selectAll.indeterminate = checkedCount > 0 && checkedCount < allCb.length;
                }
            }

            // 分页模拟
            document.getElementById('prevPage').addEventListener('click', () => {
                let page = parseInt(document.getElementById('currentPage').textContent);
                if (page > 1) document.getElementById('currentPage').textContent = page - 1;
            });
            document.getElementById('nextPage').addEventListener('click', () => {
                let page = parseInt(document.getElementById('currentPage').textContent);
                let total = Math.ceil(menuData.length / parseInt(document.getElementById('pageSizeSelect').value));
                if (page < total) document.getElementById('currentPage').textContent = page + 1;
            });
            document.getElementById('pageSizeSelect').addEventListener('change', function() {
                document.getElementById('currentPage').textContent = '1';
            });
            document.getElementById('jumpPage').addEventListener('change', function() {
                let page = parseInt(this.value);
                let total = Math.ceil(menuData.length / parseInt(document.getElementById('pageSizeSelect').value));
                if (page < 1) page = 1;
                if (page > total) page = total;
                document.getElementById('currentPage').textContent = page;
                this.value = page;
            });

            // 搜索
            document.getElementById('searchBtn').addEventListener('click', () => {
                const name = document.getElementById('filterMenuName').value.trim().toLowerCase();
                const status = document.getElementById('filterStatus').value;
                let filtered = menuData;
                if (name) filtered = filtered.filter(d => d.name.toLowerCase().includes(name));
                if (status !== '') filtered = filtered.filter(d => d.status === parseInt(status));
                renderTable(filtered);
            });

            document.getElementById('addBtn').addEventListener('click', () => alert('新增菜单'));
            document.getElementById('exportBtn').addEventListener('click', () => alert('导出数据'));

            // 批量操作下拉
            const batchBtn = document.getElementById('batchBtn');
            const batchDropdown = document.getElementById('batchDropdown');
            batchBtn.addEventListener('click', (e) => {
                e.stopPropagation();
                batchDropdown.classList.toggle('show');
            });
            document.addEventListener('click', () => batchDropdown.classList.remove('show'));
            batchDropdown.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', function(e) {
                    e.stopPropagation();
                    const action = this.dataset.action;
                    const ids = Array.from(document.querySelectorAll('.row-checkbox:checked')).map(cb => cb.dataset.id);
                    alert(`批量操作: ${action}, 选中ID: ${ids.join(', ')}`);
                    batchDropdown.classList.remove('show');
                });
            });

            // 用户下拉
            const userMenuTrigger = document.getElementById('userMenuTrigger');
            const userDropdown = document.getElementById('userDropdown');
            userMenuTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                userDropdown.classList.toggle('show');
            });
            document.addEventListener('click', () => userDropdown.classList.remove('show'));
            userDropdown.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', function(e) {
                    e.stopPropagation();
                    if (this.classList.contains('danger')) alert('退出登录');
                    else alert(`操作: ${this.textContent}`);
                    userDropdown.classList.remove('show');
                });
            });

            // 平台下拉
            const platformTrigger = document.getElementById('platformTrigger');
            const platformDropdown = document.getElementById('platformDropdown');
            platformTrigger.addEventListener('click', (e) => {
                e.stopPropagation();
                switchModule('platform');
                platformDropdown.classList.toggle('show');
            });
            platformDropdown.querySelectorAll('li').forEach(li => {
                li.addEventListener('click', function(e) {
                    e.stopPropagation();
                    alert(`切换到平台子模块: ${this.dataset.sub}`);
                    platformDropdown.classList.remove('show');
                });
            });
            document.addEventListener('click', () => platformDropdown.classList.remove('show'));

            // 模块切换
            document.querySelectorAll('.topbar-nav-item[data-module]').forEach(item => {
                if (item.dataset.module === 'platform') return;
                item.addEventListener('click', () => switchModule(item.dataset.module));
            });

            document.getElementById('switchOldBtn').addEventListener('click', () => alert('已切换到旧版界面'));

            // 初始化
            renderSidebar('user');
            renderTable(menuData);
            // 默认展开所有折叠行
            document.querySelectorAll('.expand-icon').forEach(icon => icon.click());
        })();
    </script>
</body>
</html>
